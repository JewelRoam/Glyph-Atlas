name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 发布方式：构建产物推送到 gh-pages 分支，由 GitHub Pages 从该分支提供静态文件。
# 仓库的 Pages 源已指向 gh-pages 分支，因此这里只需要写分支的权限。
permissions:
  contents: write

# 同一时间只跑一个部署；新的提交取消排队中的旧任务，但不打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 这一步同时执行数据校验、类型检查与 vite build（见 package.json 的 build 脚本）
      - name: Build
        run: npm run build

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          # 关掉 Jekyll：站点是纯静态产物，不需要再处理一遍
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
